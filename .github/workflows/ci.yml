name: Source and demo checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils qpdf ffmpeg espeak-ng tesseract-ocr tesseract-ocr-eng
      - name: Generate original examples
        run: ./scripts/bootstrap.sh
      - name: Source publication checks
        run: python3 scripts/audit_public.py
      - name: Backend regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Browser regression tests
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          npm run test:e2e
